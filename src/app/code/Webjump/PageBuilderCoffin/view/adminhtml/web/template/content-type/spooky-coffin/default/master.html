<div class="spooky-coffin-block" attr="data.main.attributes" ko-style="data.main.style" css="data.main.css">
    <div class="spooky-coffin-card">
        <div class="spooky-coffin-ornament-top">
            <span class="coffin-bat">🦇</span>
            <span class="coffin-head-icon">⚰️</span>
            <span class="coffin-bat">🦇</span>
        </div>

        <!-- ko if: data.badge.html() -->
        <div class="spooky-coffin-badge-container">
            <span class="spooky-coffin-badge" attr="data.badge.attributes" html="data.badge.html"></span>
        </div>
        <!-- /ko -->

        <!-- ko if: data.image.attributes().src -->
        <div class="spooky-coffin-image-container">
            <!-- ko if: data.link.attributes().href -->
            <a attr="data.link.attributes">
                <img class="spooky-coffin-image" attr="data.image.attributes" ko-style="data.image.style" />
            </a>
            <!-- /ko -->
            <!-- ko ifnot: data.link.attributes().href -->
            <img class="spooky-coffin-image" attr="data.image.attributes" ko-style="data.image.style" />
            <!-- /ko -->
        </div>
        <!-- /ko -->

        <div class="spooky-coffin-content">
            <!-- ko if: data.title.html() -->
            <h3 class="spooky-coffin-title" attr="data.title.attributes" html="data.title.html"></h3>
            <!-- /ko -->

            <!-- ko if: data.description.html() -->
            <p class="spooky-coffin-description" attr="data.description.attributes" html="data.description.html"></p>
            <!-- /ko -->

            <div class="spooky-coffin-action">
                <!-- ko if: data.link.attributes().href -->
                <a class="action primary spooky-coffin-btn" attr="data.link.attributes">
                    <span attr="data.button.attributes" html="data.button.html() || 'Abrir o Caixão ⚰️'"></span>
                </a>
                <!-- /ko -->
                <!-- ko ifnot: data.link.attributes().href -->
                <button type="button" class="action primary spooky-coffin-btn">
                    <span attr="data.button.attributes" html="data.button.html() || 'Abrir o Caixão ⚰️'"></span>
                </button>
                <!-- /ko -->
            </div>
        </div>
    </div>
</div>
